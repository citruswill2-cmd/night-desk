<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIGHT DESK — file a brief</title>
  <meta name="description" content="Send Chris one paragraph. First file for a new shop, or a pin on the night board." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#050506",
            desk: "#101114",
            paper: "#E8E4DA",
            mute: "#8B8790",
            live: "#4D8BFF",
            heat: "#FF2B3A"
          },
          fontFamily: {
            display: ["Bebas Neue", "Impact", "sans-serif"],
            sans: ["Sora", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["IBM Plex Mono", "ui-monospace", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background:
        radial-gradient(640px 260px at 20% -10%, rgba(77,139,255,.2), transparent 58%),
        #050506;
      color: #E8E4DA;
    }
    .tick {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="font-sans antialiased">
  <header class="border-b border-white/10">
    <div class="mx-auto flex max-w-xl items-center justify-between gap-4 px-4 py-3">
      <a href="index.html" class="font-display text-3xl tracking-wide text-paper">NIGHT DESK</a>
      <a class="tick text-mute hover:text-paper" href="index.html">Back to the board</a>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-4 py-12">
    <p class="tick text-heat">Copy desk · one field</p>
    <h1 class="mt-2 font-display text-6xl leading-none text-paper md:text-7xl">SAY THE THING.</h1>
    <p class="mt-4 text-base leading-relaxed text-paper/70">
      No discovery call. Name, what you want the site to do, who it is for, budget if you have one, live URL if you already have one.
    </p>

    <form id="brief" class="mt-8">
      <label class="tick text-mute" for="para">The paragraph</label>
      <textarea id="para" name="para" rows="8" required placeholder="Name. What it does. Who it’s for. Budget if you have one. Live URL if you want the board." class="mt-2 w-full resize-y border border-white/15 bg-desk px-4 py-3 text-paper outline-none focus:border-live"></textarea>
      <button type="submit" class="mt-4 bg-live px-6 py-3 font-display text-xl tracking-wide text-void hover:bg-heat hover:text-paper">SEND TO CHRIS</button>
      <p class="mt-3 font-mono text-[11px] text-mute">Opens mail to citruswill2@gmail.com with the paragraph prefilled.</p>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById("brief");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = (document.getElementById("para").value || "").trim();
        var body = text || "Name.\nWhat I want the site to do.\nWho it is for.\nBudget if I have one.\nLive URL if I have one.";
        window.location.href =
          "mailto:citruswill2@gmail.com" +
          "?subject=" + encodeURIComponent("NIGHT DESK brief") +
          "&body=" + encodeURIComponent(body);
      });
    })();
  </script>
</body>
</html>
